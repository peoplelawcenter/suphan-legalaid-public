<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; }
  body {
    background:
      repeating-linear-gradient(135deg,
        #0B2E6D 0px, #0B2E6D 90px,
        #0E3A87 90px, #0E3A87 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .row { display: flex; align-items: center; gap: 56px; }
  .seal {
    width: 380px; height: 380px;
    border-radius: 50%;
    overflow: hidden;
    background: #fff;
    border: 10px solid #D9A93B;
    box-shadow: 0 0 0 4px rgba(0,0,0,0.15);
    display: flex; align-items: center; justify-content: center;
  }
  .seal img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
  <div class="row">
    <div class="seal"><img src="../public/assets/logo-pao.png"></div>
    <div class="seal"><img src="../public/assets/logo-lawyers-council.jpg"></div>
  </div>
</body>
</html>
