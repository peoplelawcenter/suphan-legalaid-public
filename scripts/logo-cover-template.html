<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 1080px; height: 878px; overflow: hidden; font-family: 'Prompt', sans-serif; }
  body {
    background:
      repeating-linear-gradient(135deg,
        #0B2E6D 0px, #0B2E6D 90px,
        #0E3A87 90px, #0E3A87 180px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .row { display: flex; align-items: center; gap: 40px; margin-bottom: 28px; }
  .seal {
    width: 260px; height: 260px;
    border-radius: 50%;
    overflow: hidden;
    background: #fff;
    border: 8px solid #D9A93B;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.15);
  }
  .seal img { width: 100%; height: 100%; object-fit: cover; }
  .title { color: #D9A93B; font-weight: 700; font-size: 38px; text-align: center; width: 100%; padding: 0 30px; line-height: 1.3; }
  .subtitle { color: #fff; font-weight: 400; font-size: 18px; text-align: center; width: 100%; padding: 0 40px; margin-top: 14px; line-height: 1.4; }
  .rule { width: 220px; height: 4px; background: #D9A93B; margin-top: 24px; border-radius: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="seal"><img src="../public/assets/logo-pao.png"></div>
    <div class="seal"><img src="../public/assets/logo-lawyers-council.jpg"></div>
  </div>
  <div class="title">ศูนย์ช่วยเหลือประชาชนทางกฎหมาย</div>
  <div class="rule"></div>
  <div class="subtitle">สภาทนายความจังหวัดสุพรรณบุรี ร่วมกับ องค์การบริหารส่วนจังหวัดสุพรรณบุรี</div>
</body>
</html>
